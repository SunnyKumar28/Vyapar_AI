id: winback_lapsed_regulars
version: 1
trigger:
  signal_kinds: [churn_cluster]
  min_severity: 0.3
goal: "Bring back regulars who haven't visited in 45+ days before they're gone for good"
diagnosis_needs:
  - churn_scores          # model-gated; falls back to the 45-day recency rule
  - rfm_decile_mix        # message the valuable half first if the cap binds
  - benchmark_gap         # is this merchant-specific or a whole-pincode pattern?
audience:
  selector: lapsed_regulars
  max_recipients: 1000
offer:
  template: flat_pct_off
  pct: 10
  cap_paise: 2000
channel: whatsapp
lang: hi
copy_key: winback_hindi
impact_model: heuristic_winback_v1
guardrails:
  min_roi: 3.0
  cost_cap_paise: 150000
  frequency_cap_per_week: 2
  audience_ceiling: 1000
  quiet_hours: ["21:30", "08:00"]
measure:
  window_days: 7
  method: diff_in_diff
  control: matched_rfm_decile   # mid-lapsed regulars (31-44d), never messaged
